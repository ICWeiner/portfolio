name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  backend:
    name: Backend build, test & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio-backend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy:
    name: Deploy to Portfolio Host
    needs: [frontend, backend]
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync infrastructure config
        run: |
          mkdir -p /opt/portfolio/infrastructure
          cp -r infrastructure/. /opt/portfolio/infrastructure/

      - name: Pull and start stack
        working-directory: /opt/portfolio/infrastructure
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose pull
          docker compose up -d
          docker compose ps

      - name: Verify backend health
        working-directory: /opt/portfolio/infrastructure
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sleep 10
          HEALTH=$(docker compose exec -T backend wget -qO- http://localhost:8080/actuator/health || true)
          echo "$HEALTH"
          case "$HEALTH" in
            *'"status":"UP"'*) echo "backend healthy" ;;
            *) echo "health check failed"; exit 1 ;;
          esac

      - name: Verify public endpoints
        working-directory: /opt/portfolio/infrastructure
        run: |
          DOMAIN=$(grep -E '^DOMAIN=' .env | cut -d= -f2)
          curl -sf "https://${DOMAIN}/api/v1/ping" || echo "warning: public ping not reachable (DNS/certs may still be settling)"
