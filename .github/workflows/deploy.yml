name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio-frontend" >> "$GITHUB_OUTPUT"

      - name: Compute release version
        id: version
        working-directory: frontend
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION%-SNAPSHOT}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  backend:
    name: Backend build, test & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio-backend" >> "$GITHUB_OUTPUT"

      - name: Compute release version
        id: version
        working-directory: backend
        run: |
          REVISION=$(sed -n 's:.*<revision>\([^<]*\)</revision>.*:\1:p' pom.xml | head -1)
          echo "version=${REVISION%-SNAPSHOT}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            REVISION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  bump-develop:
    name: Bump snapshot versions on develop
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Compute next snapshot versions
        id: next
        run: |
          next_snapshot() {
            printf '%s' "$1" | sed 's/-SNAPSHOT$//' | awk -F. '{OFS="."; $NF=$NF+1; print}'
          }
          BE_REV=$(sed -n 's:.*<revision>\([^<]*\)</revision>.*:\1:p' backend/pom.xml | head -1)
          FE_VER=$(node -p "require('./frontend/package.json').version")
          echo "backend=$(next_snapshot "$BE_REV")-SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "frontend=$(next_snapshot "$FE_VER")-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Bump versions
        run: |
          sed -i "s|<revision>.*</revision>|<revision>${{ steps.next.outputs.backend }}</revision>|" backend/pom.xml
          jq --arg v "${{ steps.next.outputs.frontend }}" '.version=$v' frontend/package.json > /tmp/package.json && mv /tmp/package.json frontend/package.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/pom.xml frontend/package.json
          git commit -m "chore: bump snapshots to ${{ steps.next.outputs.backend }} / ${{ steps.next.outputs.frontend }}"
          git push origin develop

  deploy:
    name: Deploy to Portfolio Host
    needs: [frontend, backend]
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync infrastructure config
        run: |
          mkdir -p /opt/portfolio/infrastructure
          cp -r infrastructure/. /opt/portfolio/infrastructure/

      - name: Pull and start stack
        working-directory: /opt/portfolio/infrastructure
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose pull
          docker compose up -d
          docker compose ps

      # TODO: replace the fixed sleep with a proper readiness wait (poll
      # /actuator/health with retry/backoff, or compose healthcheck +
      # depends_on.condition: service_healthy). See master-plan Phase 1.
      - name: Verify backend health
        working-directory: /opt/portfolio/infrastructure
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sleep 10
          HEALTH=$(docker compose exec -T backend wget -qO- http://localhost:8080/actuator/health || true)
          echo "$HEALTH"
          case "$HEALTH" in
            *'"status":"UP"'*) echo "backend healthy" ;;
            *) echo "health check failed"; exit 1 ;;
          esac

      - name: Verify public endpoints
        working-directory: /opt/portfolio/infrastructure
        run: |
          DOMAIN=$(grep -E '^DOMAIN=' .env | cut -d= -f2)
          curl -sf "https://${DOMAIN}/api/v1/ping" || echo "warning: public ping not reachable (DNS/certs may still be settling)"
